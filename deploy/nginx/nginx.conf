# FileCodeBox nginx 反向代理模板（v0.4+，与后端安全能力配套）。
#
# ── 部署必读：trusted_proxies ─────────────────────────────────────────
# 后端对 X-Forwarded-For 做 CIDR 可信校验（security.trusted_proxies）：
# 只有"直连对端"落在可信网段内才采信 XFF。nginx 反代部署必须做两件事之一，
# 否则限流/失败锁定全部按 nginx 的 IP 计数（所有用户共享一个限流桶、误锁）：
#   a) 在 FileCodeBox 配置中把 nginx 所在网段加入可信列表，例如：
#        security:
#          trusted_proxies: ["172.18.0.0/16"]   # docker 网段按实际调整
#      （env: FCB_TRUSTED_PROXIES=172.18.0.0/16）
#   b) 或保持 trusted_proxies 为空（此时后端忽略 XFF，按直连 IP 判定）——
#      仅当你接受"所有请求视为来自 nginx"时可行，不推荐。
# ──────────────────────────────────────────────────────────────────────
#
# ── 大小三配平 ────────────────────────────────────────────────────────
# nginx 的 client_max_body_size 必须 >= FileCodeBox 的 upload.upload_size
# （单请求体上限，默认 10MB；直传分享/文本/登录表单都受它约束）。
# 分片通道单片只有 upload.chunk_size（默认 2MB）；整文件上限是
# upload.max_file_size（0=不限）——nginx 无需为"大文件"调大 body size，
# 大文件走分片/预签名，单片仍然很小。三处语义：
#   client_max_body_size  >= upload.upload_size   （单请求硬顶，网关层）
#   upload.max_file_size  >= 整文件上限            （分片/预签名通道，0=不限）
#   upload.chunk_size      单片大小                （= 每个分片请求的 body）
# ──────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # WebSocket 升级头映射（非 WS 请求置空，保持 keepalive）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 单请求体上限（与 upload.upload_size 配平，见文件头注释；按需调整）
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream filecodebox {
        server filecodebox:12345;   # docker-compose 服务名；K8s/裸机按实际调整
        keepalive 32;
    }

    # 通用反代头（各 location 复用）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    server {
        listen 80;
        server_name localhost;   # 替换为实际域名

        # 生产 HTTPS 部署：启用跳转并打开下方 443 server 块
        # return 301 https://$server_name$request_uri;

        # ── 下载/分片/预签名：流式透传 ──────────────────────────────
        # 关闭缓冲（大文件不过 nginx 缓冲区）、放宽超时（慢速大下载）。
        # X-Accel-Buffering 头由后端控制时此配置不冲突。
        location ~ ^/(share/download|chunk/|api/v1/presign|anonymous/download) {
            proxy_pass http://filecodebox;
            proxy_buffering off;
            proxy_request_buffering off;   # 上传分片流式转发
            proxy_connect_timeout 15s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;       # 慢速大文件下载；按网络放宽
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # ── 带哈希的前端静态资源：长缓存（文件名含 hash，内容变更即改名）──
        location /assets/ {
            proxy_pass http://filecodebox;
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_set_header Host $host;
        }

        # ── 其余全部走后端（API + SPA 回退）────────────────────────
        # index.html 由后端 SPA 回退返回，禁止强缓存（发版后用户拿到旧页面的
        # 最常见原因就是这里加了 immutable/expires）
        location / {
            proxy_pass http://filecodebox;
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # WebSocket：后端当前无 WS 端点，保留头部以备将来启用（无害）
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            add_header Cache-Control "no-cache";
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

# ── 子路径反代部署（上游 #247 诉求：挂在既有站点的 /fcb/ 下）──────────
# 前端为 hash 路由（/#/...），子路径部署无需资源路径改写，仅需：
#   1. location 前缀 + 去前缀转发（下方 rewrite）
#   2. FileCodeBox 的 server.base_url 配置为对外完整前缀地址
#      （如 https://example.com/fcb），分享链接/静态资源引用才能正确生成
# 需要时取消注释并按实际前缀调整：
