apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filecodebox
  namespace: filecodebox
  labels:
    app: filecodebox
  annotations:
    # 按实际 ingress controller 调整（nginx-ingress 示例）
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"  # 允许大文件上传
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx  # 按集群实际 IngressClass 修改
  tls:
    - hosts:
        - filecodebox.example.com  # 替换为实际域名
      secretName: filecodebox-tls   # 替换为实际 TLS Secret
  rules:
    - host: filecodebox.example.com  # 替换为实际域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filecodebox
                port:
                  name: http
